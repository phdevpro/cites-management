{% if field.is_hidden %}{{ field }}{% else %}
<div class="mb-3 {{ col|default:'' }}">
  {% if field.widget_type == 'checkbox' %}
  <div class="form-check">{{ field }} <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
  {% else %}
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
  {% for e in field.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
</div>{% endif %}
