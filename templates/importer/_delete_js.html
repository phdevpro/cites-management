<script>
function confirmDelete(what) {
  const form = event.target.closest('form');
  const all = event.target.name === 'all' || event.target.name === 'whole';
  if (!all && !form.querySelector('.row-check:checked')) { alert('Seleziona almeno un elemento.'); return false; }
  return confirm('Eliminare definitivamente ' + what + '? I file caricati e i dati estratti verranno cancellati.');
}
const selectAll = document.getElementById('select-all');
if (selectAll) selectAll.addEventListener('change', () =>
  document.querySelectorAll('.row-check').forEach(c => { c.checked = selectAll.checked; }));
</script>
