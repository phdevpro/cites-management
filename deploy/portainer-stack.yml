# CITES Manager – Portainer stack (Traefik on external "letsencrypt" network)
# Environment: load deploy/stack.env.example into the stack's env (Portainer saves it as stack.env).

networks:
  letsencrypt:        # Traefik external network (already exists)
    external: true
  backend:            # private network for internal services
    driver: bridge

volumes:
  cites-media:        # uploaded ID copies, certificates, generated PDFs
  cites-db-data:

services:
  cites-web:
    container_name: cites_web
    image: ghcr.io/phdevpro/cites-management:${CITES_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${CITES_HOST}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${CITES_HOST}
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@cites-db:5432/${DB_DATABASE_NAME}
      TZ: Europe/Rome
    volumes:
      - cites-media:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      cites-db:
        condition: service_healthy
    networks:
      - letsencrypt
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=letsencrypt

      # HTTPS router esterno
      - traefik.http.routers.cites.rule=Host(`${CITES_HOST}`)
      - traefik.http.routers.cites.entrypoints=websecure
      - traefik.http.routers.cites.tls=true
      - traefik.http.routers.cites.tls.certresolver=cloudflare

      # Service: gunicorn inside the container
      - traefik.http.services.cites.loadbalancer.server.port=8000

      # Security headers + compression
      # SAMEORIGIN (not frameDeny): the app previews PDFs in same-origin iframes
      - traefik.http.routers.cites.middlewares=cites-sec,cites-compress
      - traefik.http.middlewares.cites-compress.compress=true
      - traefik.http.middlewares.cites-sec.headers.stsSeconds=63072000
      - traefik.http.middlewares.cites-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.cites-sec.headers.stsPreload=true
      - traefik.http.middlewares.cites-sec.headers.forceSTSHeader=true
      - traefik.http.middlewares.cites-sec.headers.customFrameOptionsValue=SAMEORIGIN
      - traefik.http.middlewares.cites-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.cites-sec.headers.browserXssFilter=true
      - traefik.http.middlewares.cites-sec.headers.referrerPolicy=same-origin

  # Daily deadline e-mails (needs EMAIL_* in stack.env)
  cites-reminders:
    container_name: cites_reminders
    image: ghcr.io/phdevpro/cites-management:${CITES_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@cites-db:5432/${DB_DATABASE_NAME}
      TZ: Europe/Rome
    entrypoint: []
    command: ["sh", "-c", "sleep 120; while true; do python manage.py send_reminders; sleep 86400; done"]
    depends_on:
      - cites-web
    networks:
      - backend

  cites-db:
    container_name: cites_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - cites-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  cites-db-backup:
    container_name: cites_db_backup
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: cites-db
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "0 3 * * *"
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      POSTGRES_BACKUP_TYPE: custom
    volumes:
      - ${DBBK_LOCATION}:/backups
    networks:
      - backend
    depends_on:
      - cites-db
