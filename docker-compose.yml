# Production-style stack. Copy .env.example to .env and set at least
# DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_TRUSTED_ORIGINS, POSTGRES_PASSWORD.
services:
  web:
    image: ghcr.io/phdevpro/cites-management:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://cites:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/cites
    volumes:
      - media:/data
    ports:
      - "127.0.0.1:8000:8000"   # put a TLS reverse proxy (Caddy/Traefik/nginx) in front
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cites
      POSTGRES_USER: cites
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cites -d cites"]
      interval: 5s
      retries: 10

volumes:
  media:
  pgdata:
